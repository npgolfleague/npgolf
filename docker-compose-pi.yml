services:
  mysql:
    image: mysql:8.0
    container_name: npgolf-mysql-pi
    restart: always
    ports:
      # Only from the Pi itself; use an SSH tunnel from another computer.
      - "127.0.0.1:3308:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASS}
      MYSQL_DATABASE: npgolf
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - npgolf-network

  app:
    image: crj001xx/npgolf:latest
    container_name: npgolf-app-pi
    restart: always
    expose:
      - "3000"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      - mysql
    environment:
      DB_HOST: npgolf-mysql-pi
      DB_PORT: 3306
      # Limited account: reads and changes data, can't alter tables. DB_PASS is root's.
      DB_USER: ${APP_DB_USER:?Set APP_DB_USER in .env on the Pi}
      DB_PASS: ${APP_DB_PASS:?Set APP_DB_PASS in .env on the Pi}
      DB_NAME: npgolf
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env on the Pi}
      JWT_EXPIRES_IN: 8h
      BCRYPT_ROUNDS: 10
      SMS_ENABLED: ${SMS_ENABLED:-false}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_API_KEY: ${TWILIO_API_KEY}
      TWILIO_API_SECRET: ${TWILIO_API_SECRET}
      TWILIO_PHONE_NUMBER: ${TWILIO_PHONE_NUMBER}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      EMAIL_POLLER_ENABLED: ${EMAIL_POLLER_ENABLED:-false}
      EMAIL_FROM: ${EMAIL_FROM}
      APP_BASE_URL: https://npgolf.net
    networks:
      - npgolf-network

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: npgolf-cloudflared
    restart: always
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - app
    networks:
      - npgolf-network

volumes:
  mysql_data:

networks:
  npgolf-network:
