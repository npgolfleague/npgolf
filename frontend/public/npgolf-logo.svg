<svg width="1200" height="320" viewBox="0 0 1200 320" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">NPGOLF League Logo</title>
  <desc id="desc">A golf-themed logo with a tee marker icon and the word NPGOLF LEAGUE.</desc>

  <defs>
    <linearGradient id="grass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#16A34A" />
      <stop offset="100%" stop-color="#15803D" />
    </linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1D4ED8" />
      <stop offset="100%" stop-color="#1E3A8A" />
    </linearGradient>
  </defs>

  <rect x="20" y="20" width="280" height="280" rx="40" fill="url(#sky)" />

  <circle cx="160" cy="170" r="82" fill="#DCFCE7" opacity="0.95" />
  <ellipse cx="160" cy="226" rx="70" ry="20" fill="url(#grass)" />

  <rect x="155" y="90" width="10" height="90" rx="4" fill="#0F172A" />
  <path d="M165 95 L230 115 L165 135 Z" fill="#FACC15" />

  <circle cx="122" cy="205" r="13" fill="white" />
  <circle cx="118" cy="201" r="1.1" fill="#CBD5E1" />
  <circle cx="126" cy="201" r="1.1" fill="#CBD5E1" />
  <circle cx="122" cy="208" r="1.1" fill="#CBD5E1" />

  <text x="340" y="165" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="128" font-weight="800" fill="#0F172A" letter-spacing="2">NPGOLF</text>
  <text x="344" y="224" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="48" font-weight="600" fill="#334155" letter-spacing="8">LEAGUE</text>
</svg>
